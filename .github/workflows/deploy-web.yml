name: Deploy Web to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
      - 'pnpm-lock.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch wrangler config
        run: |
          node -e "
          const fs = require('fs');
          let code = fs.readFileSync('apps/web/wrangler.jsonc', 'utf8');
          // use eval to parse JSONC (handles block comments and trailing commas)
          const config = eval('(' + code + ')');
          
          if (process.env.WEB_CUSTOM_DOMAIN) {
            config.routes = [{ pattern: process.env.WEB_CUSTOM_DOMAIN, custom_domain: true }];
          } else {
            // Delete upstream author's hardcoded routes (e.g. o-c.do) so deployment doesn't fail
            // Cloudflare will automatically use a .workers.dev subdomain instead.
            delete config.routes;
          }
          
          if (process.env.D1_DATABASE_ID) {
            if (config.d1_databases && config.d1_databases.length > 0) {
              config.d1_databases[0].database_id = process.env.D1_DATABASE_ID;
            }
          } else {
            delete config.d1_databases;
          }
          
          // Next.js minimal mode
          config.vars = config.vars || {};
          config.vars.NEXT_PRIVATE_MINIMAL_MODE = 'true';
          
          fs.writeFileSync('apps/web/wrangler.jsonc', JSON.stringify(config, null, 2));
          console.log('✅ Patched wrangler config');
          "
        env:
          WEB_CUSTOM_DOMAIN: ${{ vars.WEB_CUSTOM_DOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

      - name: Build & Deploy
        run: pnpm run deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
