name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          ls /Applications | sed -n '1,20p'
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Detect Xcode project
        id: detect
        run: |
          set -e
          PROJECT_PATH=$(find apps/ios -name "*.xcodeproj" | head -n 1)
          WORKSPACE_PATH=$(find apps/ios -name "*.xcworkspace" | head -n 1 || true)
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "workspace_path=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"

      - name: List schemes
        run: |
          set -e
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild -workspace "${{ steps.detect.outputs.workspace_path }}" -list
          else
            xcodebuild -project "${{ steps.detect.outputs.project_path }}" -list
          fi

      - name: Build archive
        run: |
          set -e
          SCHEME="Orange Cloud"
          ARCHIVE_PATH="$PWD/build/OrangeCloud.xcarchive"
          mkdir -p build
          
          # 核心修改点1：加入禁用签名的环境变量
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild \
              -workspace "${{ steps.detect.outputs.workspace_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          else
            xcodebuild \
              -project "${{ steps.detect.outputs.project_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          fi

      - name: Build payload and IPA
        run: |
          set -e
          echo "Packaging Payload from archive..."
          cd "$PWD/build"
          
          APP_PATH=$(find OrangeCloud.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in archive!"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r OrangeCloud.ipa Payload
          
          mkdir -p export
          mv OrangeCloud.ipa export/
          echo "Successfully created unsigned IPA: build/export/OrangeCloud.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-build-logs
          path: build/xcodebuild-archive.log
          if-no-files-found: warn

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-xcarchive
          path: build/OrangeCloud.xcarchive
          if-no-files-found: warn
