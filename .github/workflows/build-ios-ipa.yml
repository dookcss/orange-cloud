name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Detect Xcode project
        id: detect
        run: |
          set -e
          PROJECT_PATH=$(find apps/ios -name "*.xcodeproj" | head -n 1)
          WORKSPACE_PATH=$(find apps/ios -name "*.xcworkspace" | head -n 1 || true)
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "workspace_path=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build App (No Sign)
        run: |
          set -e
          SCHEME="Orange Cloud"
          BUILD_DIR="$PWD/build/derived"
          mkdir -p build
          
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild build \
              -workspace "${{ steps.detect.outputs.workspace_path }}" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$BUILD_DIR" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              DEVELOPMENT_TEAM="" \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild.log
          else
            xcodebuild build \
              -project "${{ steps.detect.outputs.project_path }}" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$BUILD_DIR" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              DEVELOPMENT_TEAM="" \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild.log
          fi

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/derived/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            exit 1
          fi
          
          mkdir -p build/export/Payload
          cp -a "$APP_PATH" build/export/Payload/
          
          rm -rf build/export/Payload/*.app/_CodeSignature
          
          cd build/export
          zip -qry OrangeCloud.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-build-logs
          path: build/xcodebuild.log
          if-no-files-found: warn
