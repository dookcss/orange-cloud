name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          ls /Applications | sed -n '1,20p'
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Detect Xcode project
        id: detect
        run: |
          set -e
          PROJECT_PATH=$(find apps/ios -name "*.xcodeproj" | head -n 1)
          WORKSPACE_PATH=$(find apps/ios -name "*.xcworkspace" | head -n 1 || true)
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "workspace_path=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"

      - name: List schemes
        run: |
          set -e
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild -workspace "${{ steps.detect.outputs.workspace_path }}" -list
          else
            xcodebuild -project "${{ steps.detect.outputs.project_path }}" -list
          fi

      - name: Inject temporary code signing
        run: |
          set -e
          find apps/ios -type f -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' {} +
          find apps/ios -type f -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_ENTITLEMENTS = .*;/CODE_SIGN_ENTITLEMENTS = "";/g' {} +
          find apps/ios -type f -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +
          
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          
          cert_req=$(cat <<'EOF'
          [req]
          default_bits = 2048
          prompt = no
          default_md = sha256
          distinguished_name = dn
          [dn]
          C = US
          O = Self Signed
          CN = Apple Development: Fake Cert
          EOF
          )
          echo "$cert_req" > cert.conf
          openssl req -x509 -newkey rsa:2048 -nodes -keyout fake.key -out fake.crt -days 365 -config cert.conf
          openssl pkcs12 -export -out fake.p12 -inkey fake.key -in fake.crt -password pass:
          security import fake.p12 -k $KEYCHAIN_PATH -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

      - name: Build archive
        run: |
          set -e
          SCHEME="Orange Cloud"
          ARCHIVE_PATH="$PWD/build/OrangeCloud.xcarchive"
          mkdir -p build
          
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild \
              -workspace "${{ steps.detect.outputs.workspace_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY="Apple Development: Fake Cert" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          else
            xcodebuild \
              -project "${{ steps.detect.outputs.project_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY="Apple Development: Fake Cert" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          fi

      - name: Build payload and IPA
        run: |
          set -e
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          APP_PATH=$(find build/OrangeCloud.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            exit 1
          fi
          
          mkdir -p build/Payload
          cp -a "$APP_PATH" build/Payload/
          rm -rf build/Payload/*.app/_CodeSignature
          
          cd build
          zip -qry OrangeCloud.ipa Payload
          
          mkdir -p export
          mv OrangeCloud.ipa export/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-build-logs
          path: |
            build/xcodebuild-archive.log
            exportOptions.plist
          if-no-files-found: warn

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-xcarchive
          path: build/OrangeCloud.xcarchive
          if-no-files-found: warn
