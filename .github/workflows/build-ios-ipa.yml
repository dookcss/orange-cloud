name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Detect Xcode project
        id: detect
        run: |
          set -e
          PROJECT_PATH=$(find apps/ios -name "*.xcodeproj" | head -n 1)
          WORKSPACE_PATH=$(find apps/ios -name "*.xcworkspace" | head -n 1 || true)
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "workspace_path=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"

      - name: List schemes
        run: |
          set -e
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild -workspace "${{ steps.detect.outputs.workspace_path }}" -list
          else
            xcodebuild -project "${{ steps.detect.outputs.project_path }}" -list
          fi

      - name: Build archive
        run: |
          set -e
          SCHEME="Orange Cloud"
          ARCHIVE_PATH="$PWD/build/OrangeCloud.xcarchive"
          mkdir -p build
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild \
              -workspace "${{ steps.detect.outputs.workspace_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              -destination "generic/platform=iOS" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          else
            xcodebuild \
              -project "${{ steps.detect.outputs.project_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              -destination "generic/platform=iOS" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          fi

      - name: Install ldid
        run: brew install ldid

      - name: Package IPA with entitlements
        run: |
          set -e
          ARCHIVE_PATH="$PWD/build/OrangeCloud.xcarchive"
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            exit 1
          fi

          cat > /tmp/entitlements.plist <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.jiamin.chen.Orange-Cloud</string>
            </array>
            <key>keychain-access-groups</key>
            <array>
              <string>$(AppIdentifierPrefix)jiamin.chen.orange-cloud.shared</string>
            </array>
          </dict>
          </plist>
          ENTEOF

          cat > /tmp/entitlements-main.plist <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.jiamin.chen.Orange-Cloud</string>
            </array>
            <key>keychain-access-groups</key>
            <array>
              <string>$(AppIdentifierPrefix)jiamin.chen.orange-cloud.shared</string>
            </array>
          </dict>
          </plist>
          ENTEOF

          ldid -S/tmp/entitlements-main.plist "$APP_PATH/$(basename "$APP_PATH" .app)"

          find "$APP_PATH" -name "*.appex" -type d | while read ext; do
            EXT_BIN="$ext/$(basename "$ext" .appex)"
            if [ -f "$EXT_BIN" ]; then
              ldid -S/tmp/entitlements.plist "$EXT_BIN"
            fi
          done

          find "$APP_PATH/Frameworks" -name "*.dylib" -type f 2>/dev/null | while read dylib; do
            ldid -S "$dylib"
          done

          find "$APP_PATH/Frameworks" -name "*.framework" -type d 2>/dev/null | while read fw; do
            FW_BIN="$fw/$(basename "$fw" .framework)"
            if [ -f "$FW_BIN" ]; then
              ldid -S "$FW_BIN"
            fi
          done

          mkdir -p build/Payload
          cp -a "$APP_PATH" build/Payload/

          cd build
          zip -qry OrangeCloud.ipa Payload

          mkdir -p export
          mv OrangeCloud.ipa export/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-build-logs
          path: build/xcodebuild-archive.log
          if-no-files-found: warn
