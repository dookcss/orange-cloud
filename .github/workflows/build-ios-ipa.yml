name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install Enterprise Certificate and Provisioning Profile
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          set -e
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          echo "$CERT_P12_BASE64" | base64 --decode > $CERT_PATH
          
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          
          security import $CERT_PATH -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          
          PROVISION_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROVISION_DIR"
          echo "$PROVISION_BASE64" | base64 --decode > "$PROVISION_DIR/profile.mobileprovision"

      - name: Modify Bundle Identifier
        run: |
          set -e
          find apps/ios -type f -name "project.pbxproj" -exec sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = jiamin\.chen\.orange-cloud/PRODUCT_BUNDLE_IDENTIFIER = com.ctq.qmc.yiban.product/g' {} +
          find apps/ios -type f -name "project.pbxproj" -exec sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = jiamin\.chen\.orange-cloud\.widgets/PRODUCT_BUNDLE_IDENTIFIER = com.ctq.qmc.yiban.product.widgets/g' {} +
          find apps/ios -type f -name "project.pbxproj" -exec sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = jiamin\.chen\.orange-cloud\.watch/PRODUCT_BUNDLE_IDENTIFIER = com.ctq.qmc.yiban.product.watch/g' {} +

      - name: Detect Xcode project
        id: detect
        run: |
          set -e
          PROJECT_PATH=$(find apps/ios -name "*.xcodeproj" | head -n 1)
          WORKSPACE_PATH=$(find apps/ios -name "*.xcworkspace" | head -n 1 || true)
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "workspace_path=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build archive with Enterprise Cert
        run: |
          set -e
          SCHEME="Orange Cloud"
          ARCHIVE_PATH="$PWD/build/OrangeCloud.xcarchive"
          mkdir -p build
          
          if [ -n "${{ steps.detect.outputs.workspace_path }}" ]; then
            xcodebuild \
              -workspace "${{ steps.detect.outputs.workspace_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY="iPhone Distribution: China Telecom Corporation Limited" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE="Manual" \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          else
            xcodebuild \
              -project "${{ steps.detect.outputs.project_path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY="iPhone Distribution: China Telecom Corporation Limited" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE="Manual" \
              archive \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED" \
              | tee build/xcodebuild-archive.log
          fi

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/OrangeCloud.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            exit 1
          fi
          
          mkdir -p build/Payload
          cp -a "$APP_PATH" build/Payload/
          
          cd build
          zip -qry OrangeCloud.ipa Payload
          
          mkdir -p export
          mv OrangeCloud.ipa export/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-build-logs
          path: build/xcodebuild-archive.log
          if-no-files-found: warn
