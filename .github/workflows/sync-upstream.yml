name: Sync upstream

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/chen2he/orange-cloud.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main -X theirs --no-commit --no-ff || true
          git checkout HEAD -- .github/workflows/
          git commit -m "Merge upstream/main, keeping local workflows" || echo "Nothing to commit"

      - name: Push to fork
        run: git push origin main
